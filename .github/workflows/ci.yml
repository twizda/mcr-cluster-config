name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # reused by release.yml before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck and shared code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ShellCheck
        run: shellcheck -s bash -S warning swarm-core-audit.sh support-dump-count-cores.sh tests/*.sh scripts/*.sh windows/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -no-color
      - name: Shared code is identical in both scripts, and versions match
        run: tests/check-shared-code.sh

  dump-tests:
    name: Support dump tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the tests with its built-in bash 3.2
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run support dump tests
        run: /bin/bash tests/run-dump-tests.sh

  swarm-tests:
    name: Swarm and mock MKE tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run swarm tests
        run: tests/run-swarm-tests.sh

  powershell-tests:
    name: PowerShell tests (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # pwsh on Linux also re-runs every test with Windows PowerShell 5.1's JSON behavior
          - { os: ubuntu-24.04, shell: pwsh }
          - { os: windows-2022, shell: powershell }
          - { os: windows-2022, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run PowerShell tests
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests/run-powershell-tests.ps1

  powershell-lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = foreach ($path in @('windows', 'tests')) {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Warning, Error
          }
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250
          if ($results) { exit 1 }
          Write-Output 'No PSScriptAnalyzer warnings or errors'

  windows-swarm:
    name: Windows Swarm test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Make sure the Docker engine is running
        shell: pwsh
        run: |
          # The Windows runner images don't always have the Docker service started when a job begins
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          for ($i = 0; $i -lt 60; $i++) {
            docker version --format '{{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw 'The Docker engine did not start within 2 minutes'
      - name: Live test with Windows PowerShell 5.1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-swarm-tests.ps1
      - name: Live test with PowerShell 7
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-swarm-tests.ps1

  windows-image-build:
    name: Windows image build
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the Windows variants on Linux
        run: windows/build-image.sh localhost:5000/mcr-cluster-config ci --insecure --save images
      - name: Combine with a Linux image and check every Windows entry records its build
        # The published multi-platform image stands in for the Linux part, as in a release
        run: |
          scripts/combine-image.sh localhost:5000/mcr-cluster-config:ci docker.io/twizda/mcr-cluster-config:latest \
            localhost:5000/mcr-cluster-config:ci-windows-ltsc2019 \
            localhost:5000/mcr-cluster-config:ci-windows-ltsc2022 \
            localhost:5000/mcr-cluster-config:ci-windows-ltsc2025
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-images
          path: images/windows-*.tar
          retention-days: 3

  windows-image-test:
    name: Windows image test (${{ matrix.runner }})
    needs: windows-image-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, variant: ltsc2022 }
          - { runner: windows-2025, variant: ltsc2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-images
      - name: Make sure the Docker engine is running
        shell: pwsh
        run: |
          # The Windows runner images don't always have the Docker service started when a job begins
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          for ($i = 0; $i -lt 60; $i++) {
            docker version --format '{{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw 'The Docker engine did not start within 2 minutes'
      - name: Load the image
        shell: pwsh
        run: |
          docker load -i windows-${{ matrix.variant }}.tar
          if ($LASTEXITCODE -ne 0) { throw "docker load failed with $LASTEXITCODE" }
      - name: Container test with Windows PowerShell 5.1 (direct runs)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-container-tests.ps1 -Image localhost:5000/mcr-cluster-config:ci-windows-${{ matrix.variant }}
      - name: Container test with PowerShell 7 (direct runs)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-container-tests.ps1 -Image localhost:5000/mcr-cluster-config:ci-windows-${{ matrix.variant }}
