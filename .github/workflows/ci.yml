name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # reused by release.yml before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck and shared code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ShellCheck
        run: shellcheck -s bash -S warning swarm-core-audit.sh support-dump-count-cores.sh tests/*.sh scripts/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -no-color
      - name: Shared code is identical in both scripts, and versions match
        run: tests/check-shared-code.sh

  dump-tests:
    name: Support dump tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the tests with its built-in bash 3.2
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run support dump tests
        run: /bin/bash tests/run-dump-tests.sh

  swarm-tests:
    name: Swarm and mock MKE tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run swarm tests
        run: tests/run-swarm-tests.sh

  powershell-tests:
    name: PowerShell tests (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # pwsh on Linux also re-runs every test with Windows PowerShell 5.1's JSON behavior
          - { os: ubuntu-24.04, shell: pwsh }
          - { os: windows-2022, shell: powershell }
          - { os: windows-2022, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run PowerShell tests
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests/run-powershell-tests.ps1

  powershell-lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = foreach ($path in @('windows', 'tests')) {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Warning, Error
          }
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250
          if ($results) { exit 1 }
          Write-Output 'No PSScriptAnalyzer warnings or errors'

  windows-swarm:
    name: Windows Swarm test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Live test with Windows PowerShell 5.1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-swarm-tests.ps1
      - name: Live test with PowerShell 7
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run-windows-swarm-tests.ps1
